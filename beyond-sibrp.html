<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond SiBRP — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=25">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div id="brand-mark-mount"></div>
    <h1>Beyond SiBRP</h1>
    <p class="lede">A showcase of what past students have gone on to build, research, and present after completing this curriculum. Click into a story to read more.</p>
  </div>
</section>

<main class="container">
  <div class="portfolio-grid" id="portfolio-grid"></div>
</main>

<footer class="site-footer">
  Adapted from Stanford iGEM Bioengineering Research Program (SiBRP), Session 2 — July 15th, 2026.
</footer>

<script src="js/modules-meta.js?v=6"></script>
<script src="js/portfolio-data.js?v=2"></script>
<script src="js/progress.js?v=13"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function renderProjects(mountEl, projects) {
  if (!projects.length) {
    mountEl.outerHTML = `<div class="portfolio-empty">No projects added yet — check back soon.</div>`;
    return;
  }
  mountEl.innerHTML = projects.map(p => `
    <a class="portfolio-card" href="project.html?id=${encodeURIComponent(p.id)}">
      <div class="portfolio-thumb chip-${p.accent}">${p.image ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" loading="lazy">` : escapeHtml(initials(p.student))}</div>
      <div class="portfolio-body">
        <span class="portfolio-tag chip-${p.accent}">${escapeHtml(p.tag)}${p.year ? " &middot; " + escapeHtml(p.year) : ""}</span>
        <h3>${escapeHtml(p.title)}</h3>
        <div class="portfolio-student">${escapeHtml(p.student)}</div>
        <p>${escapeHtml(p.shortDescription)}</p>
      </div>
    </a>
  `).join("");
}

(async () => {
  await renderPublicHeader(document.getElementById("site-header"), true);
  document.getElementById("brand-mark-mount").outerHTML = BRAND_MARK;
  const res = await fetch("/api/portfolio-projects");
  const data = await res.json();
  renderProjects(document.getElementById("portfolio-grid"), data.projects || []);
})();
</script>
</body>
</html>
