        <p><a href="https://igem.stanford.edu" target="_blank" rel="noopener">Stanford iGEM</a> is an interdisciplinary team of Stanford undergraduates competing in <strong>iGEM</strong> (International Genetically Engineered Machine — not the most straightforward acronym, we know), an organization centered around an annual synthetic biology competition.</p>
        <p>iGEM describes itself as the "beating heart of synthetic biology." Since the founding of iGEM in 2003, <strong>100,000+ iGEMers</strong> have worked on <strong>5,000+ synthetic biology projects</strong>. Biological parts from these projects are deposited in the <a href="https://registry.igem.org/" target="_blank" rel="noopener">iGEM Registry</a>, which now contains more than <strong>84,000 documented parts</strong>, to promote collaboration between bioengineers. iGEM alumni have also founded <strong>300+ ventures</strong>, including major companies like <a href="https://www.benchling.com/" target="_blank" rel="noopener">Benchling</a> and <a href="https://www.ginkgo.bio/" target="_blank" rel="noopener">Ginkgo Bioworks</a>.</p>
        <p>iGEM's work broadly spans four foundational areas — <strong>Community, Technology, Responsibility, and Innovation</strong> — all with the hope of ultimately using synthetic biology to benefit humanity and our planet.</p>
        <p>These are the same four principles that guide our work at Stanford iGEM. Our educational initiatives range from the site you're on right now to the Stanford iGEM Bioengineering Research Program (SiBRP) and <a href="https://knockdev.itch.io/phils-laberia" target="_blank" rel="noopener">Phil's Laberia</a> (check it out!), a video game teaching foundational lab skills and their underlying principles in a fun, accessible way. Our team members come together to dream up a new project each year, building new, innovative technologies while integrating bigger-picture implications and ethics throughout the entire design process.</p>
        <p>As a team, we're all deeply interested in bioengineering, but we study everything from data science to English and electrical engineering. We believe diversity in thought and experience is necessary to achieve comprehensive understanding and resolution of the problems we face — another reason why we believe in equipping you with the tools to join the hopeful world of synthetic biology.</p>

        <p>Bioengineering is a very, very broad field. At its core, it applies engineering principles of design and analysis to biological systems and biomedical technologies. <a href="https://bioengineering.stanford.edu/" target="_blank" rel="noopener">Stanford Bioengineering</a> similarly describes the field as bringing together life sciences and engineering to advance areas ranging from healthcare and medicine to manufacturing, agriculture, and the environment.</p>
        <p>That means two people can both call themselves bioengineers while doing work that looks quite different. But regardless of what you're engineering, the shift in mindset is similar. While biology asks, <em>"What does the system naturally do?"</em>, engineering focuses on <em>"How can we redesign the system?"</em></p>

        <p>Synthetic biology is one area within the much larger world of bioengineering.</p>
        <p>The <a href="https://www.genome.gov/about-genomics/policy-issues/Synthetic-Biology" target="_blank" rel="noopener">National Human Genome Research Institute</a> defines <strong>synthetic biology</strong> as redesigning organisms for useful purposes by engineering them to have new abilities. Researchers have applied this idea to problems in medicine, manufacturing, agriculture, environmental sensing, and more.</p>
        <p>You may also hear the term <a href="https://www.genome.gov/genetics-glossary/Genetic-Engineering" target="_blank" rel="noopener"><strong>genetic engineering</strong></a>, which refers to laboratory techniques that alter the DNA makeup of an organism — for example, changing a DNA sequence, removing a region, or adding new DNA.</p>
        <p>Synthetic biology often uses genetic engineering, but tends to zoom out and ask a larger engineering question: <strong>How can we design or redesign a biological system to perform a useful function?</strong> Examples include:</p>
        <ul>
          <li>Microorganisms that produce useful medicines or materials</li>
          <li>Biological systems that detect something in the environment</li>

        <h4>1961 — Learning how cells regulate genes</h4>
        <p>François Jacob and Jacques Monod published a landmark model describing genetic regulation in bacteria. Their work helped establish the idea that cells contain regulatory systems that can turn genes on and off in response to changing conditions.</p>
        <h4>1995 — Reading an entire microbial genome</h4>
        <p>Researchers reported the complete genome sequence of <em>Haemophilus influenzae</em>, the first complete genome sequence from a free-living organism. Being able to read increasingly large amounts of DNA gave researchers a much larger foundation for understanding — and eventually redesigning — biological systems.</p>
        <h4>2000 — Building synthetic genetic circuits</h4>
        <p>Two landmark papers demonstrated that researchers could deliberately construct simple genetic circuits inside <em>E. coli</em>: a genetic toggle switch that could switch between stable states, and the repressilator, a synthetic network that produced oscillating gene expression.</p>
        <h4>2003–2004 — iGEM begins</h4>
        <p>iGEM began in 2003 as a month-long course at MIT in which students tried to design biological systems that made cells blink. In 2004, that course grew into a summer competition involving five teams.</p>
        <h4>Today</h4>

        <p>Bioengineers also work on things like:</p>
        <h4>Biomedical devices</h4>
        <p>Engineering physical or electronic technologies for biological research, diagnosis, monitoring, or treatment. Examples include medical imaging systems, portable diagnostic devices, biosensors, and wearable technologies.</p>
        <h4>Tissue engineering &amp; regenerative medicine</h4>

        <p>These areas can merge, too! A single project could involve a genetically engineered cell, a computational model that predicts its behavior, a physical device that delivers it, and a clinical study evaluating whether it works — that's part of what makes all of this so exciting.</p>
