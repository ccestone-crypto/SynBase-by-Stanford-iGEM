<script>
const MODULE = {
  id: "module2",
  number: 2,
  title: "Biology of DNA",
  lede: "DNA holds the instruction manual for biological life. This module walks through the central dogma — replication, transcription, and translation — from nucleotides all the way to finished proteins.",
  sections: [
    {
      id: "2.1",
      title: "The Central Dogma Overview",
      img: "../assets/img/module2/central-dogma.png",
      imgAlt: "Diagram of the central dogma of molecular biology",
      caption: "The central dogma of molecular biology: DNA is replicated, transcribed into RNA, and translated into protein. (Image from the City University of Hong Kong)",
      html: `
        <p>DNA doesn't do its job alone — it works through a well-defined pipeline called the <strong>central dogma of molecular biology</strong>. This pipeline has three core steps:</p>
        <ul>
          <li><strong>Replication:</strong> DNA is copied to form more DNA.</li>
          <li><strong>Transcription:</strong> DNA is used as a template to build RNA.</li>
          <li><strong>Translation:</strong> RNA is read to build proteins.</li>
        </ul>
        <p>Everything else in this module — nucleotides, base-pairing, transcription, and translation — is really just a closer look at one of these three steps. Keep this big picture in mind as we zoom in.</p>
      `,
      question: {
        prompt: "In the central dogma of molecular biology, what is the correct order of information flow?",
        options: [
          { text: "Protein → RNA → DNA", correct: false },
          { text: "DNA → RNA → Protein", correct: true },
          { text: "RNA → Protein → DNA", correct: false },
          { text: "DNA and RNA are produced simultaneously from protein.", correct: false }
        ],
        explanation: "The central dogma flows from DNA (replicated into more DNA), to RNA (via transcription), to protein (via translation)."
      }
    },
    {
      id: "2.2",
      title: "Nucleotides: Building Blocks of DNA",
      img: "../assets/img/module2/dna-nucleotide.png",
      imgAlt: "Diagram of a DNA nucleotide's structure",
      caption: "A DNA nucleotide is built from a phosphate group, a sugar, and a nucleobase, linked into a sugar-phosphate backbone. (Image from Biorender)",
      html: `
        <p>DNA is built from repeating units called <strong>nucleotides</strong>. Each nucleotide has three parts: a phosphate group, a sugar, and a nitrogen-containing <strong>nucleobase</strong>. Chains of nucleotides link together through their sugar and phosphate groups, forming the <strong>sugar-phosphate backbone</strong> that runs along the outside of the DNA molecule.</p>
        <p>The nucleobase is the variable part of each nucleotide — different sequences of bases are what encode different genetic instructions, similar to how different sequences of letters spell different words.</p>
      `,
      question: {
        prompt: "What three components make up a single DNA nucleotide?",
        options: [
          { text: "A phosphate group, a sugar, and a nucleobase", correct: true },
          { text: "Two nucleobases joined by a hydrogen bond", correct: false },
          { text: "A ribosome, an amino acid, and a codon", correct: false },
          { text: "A phospholipid head and two hydrocarbon tails", correct: false }
        ],
        explanation: "Each DNA nucleotide is composed of a phosphate group, a sugar, and a nucleobase. Chains of these nucleotides form the sugar-phosphate backbone."
      }
    },
    {
      id: "2.3",
      title: "Nucleotides: Building Blocks of RNA",
      img: "../assets/img/module2/rna-nucleotide.png",
      imgAlt: "Diagram of an RNA nucleotide's structure",
      caption: "RNA nucleotides are similar to DNA nucleotides, but use uracil in place of thymine. (Image from Biorender)",
      html: `
        <p>RNA nucleotides are built the same way as DNA nucleotides — a phosphate group, a sugar, and a nucleobase — but with one key difference: RNA uses the base <strong>uracil (U)</strong> in place of the <strong>thymine (T)</strong> found in DNA.</p>
        <p>This small substitution is one of the ways cells (and scientists) can tell RNA and DNA apart, and it becomes important later when we translate an RNA sequence using a codon table.</p>
      `,
      question: {
        prompt: "Which base is unique to RNA and replaces thymine from DNA?",
        options: [
          { text: "Adenine", correct: false },
          { text: "Guanine", correct: false },
          { text: "Cytosine", correct: false },
          { text: "Uracil", correct: true }
        ],
        explanation: "RNA nucleotides use uracil (U) in place of DNA's thymine (T). The other three bases — adenine, guanine, and cytosine — are shared between DNA and RNA."
      }
    },
    {
      id: "2.4",
      title: "Complementary Base-Pairing",
      img: "../assets/img/module2/complementary-base-pairing.png",
      imgAlt: "Diagram of complementary base pairing between A-T and C-G",
      caption: "Complementary base-pairing: A pairs with T, and C pairs with G, with GC-pairing forming three hydrogen bonds versus two for AT. (Image from Biorender)",
      html: `
        <p>DNA's four bases — <strong>A, T, C, and G</strong> — don't pair randomly. Adenine (A) always pairs with thymine (T), and cytosine (C) always pairs with guanine (G). This is called <strong>complementary base-pairing</strong>, and it's what allows the two strands of DNA to zip together into a stable double helix.</p>
        <p>Not all pairs are equally strong: <strong>GC-pairing</strong> forms three hydrogen bonds, while <strong>AT-pairing</strong> forms only two. That means DNA sequences with a higher GC-content require more energy (or higher temperature) to separate than sequences rich in A and T.</p>
      `,
      question: {
        prompt: "If two double-stranded DNA molecules were heated up, which would separate first: one with a higher AT content, or one with a higher GC content?",
        options: [
          { text: "The one with higher AT content, because AT pairs form fewer hydrogen bonds and are weaker.", correct: true },
          { text: "The one with higher GC content, because GC pairs form fewer hydrogen bonds.", correct: false },
          { text: "Both sequences separate at exactly the same temperature.", correct: false },
          { text: "Neither sequence separates; DNA cannot be melted by heat.", correct: false }
        ],
        explanation: "AT base pairs form only 2 hydrogen bonds, while GC pairs form 3. A sequence with higher AT content has weaker overall bonding between its strands, so it separates ('melts') at a lower temperature."
      }
    },
    {
      id: "2.5",
      title: "The Double Helix & Antiparallel Strands",
      img: "../assets/img/module2/double-helix-antiparallel.png",
      imgAlt: "Diagram of DNA's double helix with antiparallel strands",
      caption: "DNA's two strands run in antiparallel directions, from 5' to 3' and 3' to 5'. (Image from Biorender)",
      html: `
        <p>DNA doesn't exist as a single strand — it operates as a <strong>double helix</strong>, two strands wound around each other and held together by complementary base-pairing. Each strand has a direction, defined by the chemistry of its sugar-phosphate backbone, running from a <strong>5' (five-prime) end</strong> to a <strong>3' (three-prime) end</strong>.</p>
        <p>Critically, the two strands run in <strong>antiparallel</strong> directions — one strand runs 5' to 3', while its partner runs 3' to 5' alongside it. This directionality matters once we get to transcription, where enzymes read and build strands in a specific direction.</p>
      `,
      question: {
        prompt: "What does it mean that DNA's two strands are \"antiparallel\"?",
        options: [
          { text: "Both strands run in the same 5' to 3' direction.", correct: false },
          { text: "The two strands run in opposite directions — one 5' to 3', the other 3' to 5'.", correct: true },
          { text: "The two strands are not connected to each other at all.", correct: false },
          { text: "Only one strand has a 5' and 3' end.", correct: false }
        ],
        explanation: "DNA's two strands run in opposite (antiparallel) directions: while one strand reads 5' to 3', its complementary partner runs 3' to 5'."
      }
    },
    {
      id: "2.6",
      title: "Transcription: DNA to RNA",
      img: "../assets/img/module2/transcription-output.png",
      imgAlt: "Diagram of transcription producing an RNA strand from a DNA template",
      caption: "Transcription produces a single-stranded RNA molecule carrying the new genetic code copied from the DNA template strand. (Image from Biorender)",
      html: `
        <p>DNA has two strands with different jobs during transcription: the <strong>coding strand</strong> (the sequence you'd find written in a database) and the <strong>template strand</strong> (the complementary strand actually used to build RNA).</p>
        <p>An enzyme called <strong>RNA polymerase</strong> attaches to the DNA template strand, separates the two DNA strands, and builds a new, complementary strand using RNA bases. Because the template strand pairs with RNA bases the same way it would pair with DNA (except using U instead of T), the resulting RNA strand ends up matching the original coding strand — with U substituted for T.</p>
        <p>The output of transcription is a single-stranded RNA molecule carrying the same genetic message as the DNA coding strand.</p>
      `,
      question: {
        prompt: "During transcription, what does RNA polymerase use as its template?",
        options: [
          { text: "The DNA coding strand", correct: false },
          { text: "The DNA template strand", correct: true },
          { text: "An existing RNA molecule", correct: false },
          { text: "A finished protein", correct: false }
        ],
        explanation: "RNA polymerase attaches to the DNA template strand and builds a complementary RNA strand from it, which ends up matching the original coding strand (with U instead of T)."
      }
    },
    {
      id: "2.7",
      title: "mRNA Modifications",
      img: "../assets/img/module2/transcription-modifications.png",
      imgAlt: "Diagram of RNA being modified into mature mRNA",
      caption: "Newly transcribed RNA is modified into mature messenger RNA (mRNA) before translation. (Image from Biorender)",
      html: `
        <p>The RNA that comes straight out of transcription isn't immediately ready for translation. It undergoes modifications that convert it into mature <strong>messenger RNA (mRNA)</strong>. These modifications serve three main purposes:</p>
        <ul>
          <li>Signal to the cell that the RNA is ready to leave the nucleus</li>
          <li>Prevent the RNA from being degraded in the cytoplasm</li>
          <li>Help initiate translation once the RNA reaches a ribosome</li>
        </ul>
      `,
      question: {
        prompt: "What is one purpose of the modifications that convert new RNA into mature mRNA?",
        options: [
          { text: "To prevent the RNA from ever leaving the nucleus", correct: false },
          { text: "To protect the RNA from degradation in the cytoplasm and help initiate translation", correct: true },
          { text: "To convert the RNA back into DNA", correct: false },
          { text: "To change the RNA's nucleobases from uracil back to thymine", correct: false }
        ],
        explanation: "mRNA modifications signal that the RNA is ready to leave the nucleus, protect it from degradation in the cytoplasm, and help initiate translation."
      }
    },
    {
      id: "2.8",
      title: "Where Transcription Happens",
      img: "../assets/img/module2/transcription-location.png",
      imgAlt: "Diagram showing transcription location in the nucleus versus cytoplasm",
      caption: "Transcription occurs in the nucleus for plant and mammalian cells, and in the cytoplasm for bacterial cells (which have no nucleus). (Image from Biorender)",
      html: `
        <p>Where transcription physically happens in the cell depends on what kind of cell it is:</p>
        <ul>
          <li>In <strong>plant and mammalian cells</strong>, transcription occurs in the <strong>nucleus</strong>, where the DNA is housed.</li>
          <li>In <strong>bacterial cells</strong>, which have no nucleus, transcription occurs directly in the <strong>cytoplasm</strong>.</li>
        </ul>
        <p>This distinction traces back to Module 1: eukaryotic cells enclose their DNA in a nuclear membrane, while bacterial DNA sits freely in the cytoplasm — so transcription simply happens wherever the DNA already is.</p>
      `,
      question: {
        prompt: "Which of the following is FALSE about transcription?",
        options: [
          { text: "It synthesizes a new RNA based on a template DNA sequence.", correct: false },
          { text: "The output RNA is single stranded.", correct: false },
          { text: "The RNA bases are A, C, U, and G.", correct: false },
          { text: "Occurs in the nucleus for all cell types.", correct: true }
        ],
        explanation: "This statement is false: transcription occurs in the cytoplasm for bacterial cells, since bacteria have no nucleus. It only occurs in the nucleus for plant and mammalian cells."
      }
    },
    {
      id: "2.9",
      title: "Amino Acids and Proteins",
      img: "../assets/img/module2/amino-acids-polypeptide.png",
      imgAlt: "Diagram of amino acids linking into a polypeptide chain",
      caption: "Amino acids link together into polypeptide chains, the building blocks of proteins. (Images from Khan Academy and Biorender)",
      html: `
        <p>Proteins are built from smaller building blocks called <strong>amino acids</strong>. There are 20 key amino acids used across all of life, each with a different chemical side chain that gives it unique properties.</p>
        <p>When amino acids link together in a chain, they form a <strong>polypeptide</strong> — and one or more folded polypeptide chains make up a functional protein. The specific sequence of amino acids in that chain is determined entirely by the sequence of the mRNA that gets translated, which is the process we cover next.</p>
      `,
      question: {
        prompt: "What is formed when a chain of amino acids link together?",
        options: [
          { text: "A nucleotide", correct: false },
          { text: "A polypeptide", correct: true },
          { text: "A codon", correct: false },
          { text: "A phospholipid", correct: false }
        ],
        explanation: "Amino acids link together to form a polypeptide chain, which folds into a functional protein."
      }
    },
    {
      id: "2.10",
      title: "Translation in the Ribosome",
      img: "../assets/img/module2/ribosome-codon-anticodon.png",
      imgAlt: "Diagram of a ribosome matching a codon to a tRNA anticodon",
      caption: "Inside the ribosome, tRNA anticodons match RNA codons to deliver the correct amino acid. (Image from Biorender)",
      html: `
        <p>Translation happens inside the <strong>ribosome</strong>. As the ribosome reads along an mRNA strand three bases at a time (a <strong>codon</strong>), a matching molecule called <strong>transfer RNA (tRNA)</strong> brings in the correct amino acid.</p>
        <p>Each tRNA has an <strong>anticodon</strong> — a three-base sequence complementary to the mRNA codon it matches — attached to a specific amino acid. When the anticodon pairs with the codon, the ribosome adds that tRNA's amino acid to the growing polypeptide chain.</p>
      `,
      question: {
        prompt: "What is the role of a tRNA's anticodon during translation?",
        options: [
          { text: "It stores the cell's long-term genetic material.", correct: false },
          { text: "It pairs with the mRNA codon to deliver the matching amino acid.", correct: true },
          { text: "It forms the sugar-phosphate backbone of DNA.", correct: false },
          { text: "It separates the two DNA strands before transcription.", correct: false }
        ],
        explanation: "Each tRNA carries an anticodon that pairs with a complementary codon on the mRNA, delivering the correct amino acid to the growing polypeptide chain."
      }
    },
    {
      id: "2.11",
      title: "Reading a Codon Table",
      img: "../assets/img/module2/codon-table-example.png",
      imgAlt: "A codon table showing AUG coding for Methionine",
      caption: "A codon table maps each three-base RNA codon to the amino acid it encodes — for example, AUG codes for Methionine. (Image from Khan Academy)",
      html: `
        <p>Because each codon is three RNA bases long, and there are four possible bases, there are 64 possible codons — far more than the 20 amino acids they need to encode. A <strong>codon table</strong> is the reference chart that maps each three-base codon to the amino acid (or stop signal) it represents.</p>
        <p>For example, the codon <strong>AUG</strong> codes for the amino acid <strong>Methionine (Met)</strong>. Handily, AUG doubles as the universal <strong>start codon</strong> — the signal that tells the ribosome where to begin translating.</p>
      `,
      question: {
        prompt: "What does the codon AUG represent?",
        options: [
          { text: "A stop codon that ends translation", correct: false },
          { text: "The start codon, which codes for Methionine", correct: true },
          { text: "A nucleotide found only in DNA", correct: false },
          { text: "An anticodon on a ribosome", correct: false }
        ],
        explanation: "AUG is the start codon, which also codes for the amino acid Methionine (Met) — it's where the ribosome begins reading the mRNA sequence."
      }
    },
    {
      id: "2.12",
      title: "Summary of Translation",
      img: "../assets/img/module2/translation-summary.png",
      imgAlt: "Summary diagram of translation from start codon to stop codon",
      caption: "Translation begins at a start codon (AUG) and ends at a stop codon, reading three bases at a time. (Image from Khan Academy)",
      html: `
        <p>Putting it all together, translation follows a consistent process:</p>
        <ul>
          <li>RNA synthesized in the nucleus travels to the cytoplasm.</li>
          <li>Ribosomes attach to the RNA and begin reading its sequence.</li>
          <li>The ribosome finds the <strong>start codon (AUG)</strong> and begins translating from there.</li>
          <li>Every three RNA bases form a codon, each coding for one amino acid.</li>
          <li>Translation continues until the ribosome reaches a <strong>stop codon</strong>: UAA, UAG, or UGA.</li>
        </ul>
      `,
      question: {
        prompt: "Which of the following is a stop codon that ends translation?",
        options: [
          { text: "AUG", correct: false },
          { text: "UGA", correct: true },
          { text: "CCU", correct: false },
          { text: "GGA", correct: false }
        ],
        explanation: "UGA (along with UAA and UAG) is a stop codon. When the ribosome reaches one of these, translation ends and no additional amino acid is added."
      }
    },
    {
      id: "2.13",
      title: "Translation Practice Example",
      img: "../assets/img/module2/translation-example.png",
      imgAlt: "Worked example translating an RNA sequence into amino acids",
      caption: "Worked example: translating an RNA sequence into its amino acid chain using the start and stop codons. (Image from Khan Academy)",
      html: `
        <p>Let's apply what we've learned to an actual RNA sequence:</p>
        <p style="font-family:monospace;background:#f1f4f9;padding:8px 10px;border-radius:6px;">AAU AUG CGU GGG GAU UAC UGA UUU</p>
        <p>Scanning left to right, the first <strong>AUG</strong> marks the start codon. From there, each following triplet is read as a codon: CGU (Arg), GGG (Gly), GAU (Asp), UAC (Tyr) — until we hit <strong>UGA</strong>, the stop codon, which ends translation. Bases before the start codon and after the stop codon are not translated.</p>
      `,
      question: {
        prompt: "What will the protein output of the RNA sequence AAUAUGCGUGGGGAUUACUGAUUU be?",
        options: [
          { text: "Met-Arg-Gly-Asp-Tyr", correct: true },
          { text: "Asn-Met-Arg-Gly-Asp", correct: false },
          { text: "Met-Arg-Gly-Asp-Tyr-Stop-Phe", correct: false },
          { text: "The entire sequence is untranslatable", correct: false }
        ],
        explanation: "AUG is the start codon (codes for Met). Reading three bases at a time from there: CGU (Arg), GGG (Gly), GAU (Asp), UAC (Tyr), then UGA is the stop codon. So the protein is Met-Arg-Gly-Asp-Tyr."
      }
    }
  ]
};
