        <p>Life is separated into three domains: Eukarya, Bacteria, and Archaea.</p>
        <p>Eukarya consists of organisms whose cells contain a membrane-bound nucleus — plant, human, animal, fungal, and protist cells all belong here. Bacteria consists of single-celled organisms that do not contain a nucleus; all of them have a cell wall that contains peptidoglycan. Archaea also consists of single-celled organisms without a nucleus, but unlike Bacteria, their cell walls do not contain peptidoglycan.</p>
