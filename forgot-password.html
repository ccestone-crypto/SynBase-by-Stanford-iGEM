<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=69">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img class="brand-logo" src="assets/img/site/logo.png" alt="SynBase"><span class="brand-suffix">by Stanford iGEM</span></div>
    <p class="auth-subtitle">Enter your account email and we'll send you a link to reset your password.</p>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>

    <form id="forgot-form" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn auth-submit" id="submit-btn">Send Reset Link</button>
    </form>

    <div class="auth-switch">Remembered it? <a href="login.html">Log in</a></div>
  </div>
</div>

<script>
  const form = document.getElementById("forgot-form");
  const errorEl = document.getElementById("auth-error");
  const successEl = document.getElementById("auth-success");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("show");
    successEl.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    try {
      const res = await fetch("/api/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "Something went wrong. Please try again.");
        return;
      }

      let message = data.message || "If an account exists for that email, a reset link has been sent.";
      if (data.devResetUrl) {
        message += ` (No email server configured — dev link: <a href="${data.devResetUrl}">${data.devResetUrl}</a>)`;
      }
      successEl.innerHTML = message;
      successEl.classList.add("show");
      form.reset();
    } catch (err) {
      showError("Could not reach the server. Please try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Link";
    }
  });
</script>
</body>
</html>
