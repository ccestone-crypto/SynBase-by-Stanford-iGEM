<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SynBase</title>
<link rel="icon" type="image/x-icon" href="assets/img/site/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/site/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/site/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/site/favicon-180.png">
<link rel="stylesheet" href="css/style.css?v=83">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4XQ5Y1N331"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-4XQ5Y1N331");</script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img class="brand-logo" src="assets/img/site/logo.png" alt="SynBase"><span class="brand-suffix">by Stanford iGEM</span></div>
    <p class="auth-subtitle">Enter your account email and we'll send you a link to reset your password.</p>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>

    <form id="forgot-form" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn auth-submit" id="submit-btn">Send Reset Link</button>
    </form>

    <div class="auth-switch">Remembered it? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=2"></script>
<script src="js/avatar-data.js?v=1"></script>
<script>
  const form = document.getElementById("forgot-form");
  const errorEl = document.getElementById("auth-error");
  const successEl = document.getElementById("auth-success");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("show");
    successEl.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const email = document.getElementById("email").value.trim().toLowerCase();
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: `${location.origin}/reset-password.html`
    });

    // Supabase itself never reveals whether the email exists, so a genuine
    // error here is something else (e.g. its own rate limit) — still shown,
    // since that's actionable info for the user, unlike account existence.
    if (error) {
      showError(error.message || "Something went wrong. Please try again.");
    } else {
      successEl.textContent = "If an account exists for that email, a reset link has been sent.";
      successEl.classList.add("show");
      form.reset();
    }
    submitBtn.disabled = false;
    submitBtn.textContent = "Send Reset Link";
  });
</script>
</body>
</html>
