<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Series — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div id="brand-mark-mount"></div>
    <span class="optional-badge">Optional</span>
    <h1>Speaker Series</h1>
    <p class="lede">Guest talks and bonus videos from the SiBRP program. Watch any time — nothing here is required to finish the curriculum.</p>
  </div>
</section>

<main class="container">
  <div id="upload-mount"></div>
  <div id="speaker-grid" class="speaker-grid"></div>
</main>

<footer class="site-footer">
  Adapted from Stanford iGEM Bioengineering Research Program (SiBRP), Session 2 — July 15th, 2026.
</footer>

<script src="js/modules-meta.js?v=6"></script>
<script src="js/progress.js?v=8"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function renderUploadForm(mountEl) {
  mountEl.innerHTML = `
    <div class="content-card">
      <h2>Add a Talk</h2>
      <p style="color:var(--ink-soft);font-size:0.9rem;margin:0 0 8px;">
        Paste a YouTube link — the site shows the cover image and description here, and clicking through takes students to YouTube to actually watch it.
      </p>
      <div class="auth-error" id="upload-error"></div>
      <form id="upload-form" novalidate>
        <div class="upload-form-grid">
          <div class="form-field">
            <label for="talk-title">Title</label>
            <input type="text" id="talk-title" required>
          </div>
          <div class="form-field">
            <label for="talk-speaker">Speaker</label>
            <input type="text" id="talk-speaker" required>
          </div>
          <div class="form-field full">
            <label for="talk-youtube-url">YouTube link</label>
            <input type="url" id="talk-youtube-url" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>
          <div class="form-field full">
            <label for="talk-description">Description (optional)</label>
            <textarea id="talk-description"></textarea>
          </div>
        </div>
        <button type="submit" class="btn" id="upload-btn" style="margin-top:16px">Add Talk</button>
      </form>
    </div>
  `;

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("upload-error");
    const btn = document.getElementById("upload-btn");
    errorEl.classList.remove("show");

    const youtubeUrl = document.getElementById("talk-youtube-url").value.trim();
    if (!youtubeUrl) {
      errorEl.textContent = "Paste a YouTube link.";
      errorEl.classList.add("show");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Adding…";

    try {
      const res = await fetch("/api/admin/speaker-talks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: document.getElementById("talk-title").value,
          speakerName: document.getElementById("talk-speaker").value,
          description: document.getElementById("talk-description").value,
          youtubeUrl
        })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || `Could not add that talk (HTTP ${res.status}).`;
        errorEl.classList.add("show");
        return;
      }
      document.getElementById("upload-form").reset();
      loadTalks();
    } catch (err) {
      errorEl.textContent = "Could not reach the server. Please try again.";
      errorEl.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "Add Talk";
    }
  });
}

async function loadTalks() {
  const res = await fetch("/api/speaker-talks");
  const data = await res.json();
  renderTalks(data.talks || []);
}

const PLAY_ICON = `<svg viewBox="0 0 68 48" width="52" height="36"><path d="M66.5 7.7c-.8-2.9-2.5-5.2-5.4-6C55.8.1 34 .1 34 .1S12.2.1 6.9 1.7c-2.9.8-4.6 3.1-5.4 6C0 13 0 24 0 24s0 11 1.5 16.3c.8 2.9 2.5 5.1 5.4 5.9C12.2 47.9 34 47.9 34 47.9s21.8 0 27.1-1.7c2.9-.8 4.6-3 5.4-5.9C68 35 68 24 68 24s0-11-1.5-16.3z" fill="#212121" fill-opacity="0.8"/><path d="M27 34.5V13.5L45 24z" fill="#fff"/></svg>`;

function renderTalks(talks) {
  const gridEl = document.getElementById("speaker-grid");
  if (!talks.length) {
    gridEl.innerHTML = `<div class="speaker-empty">No talks added yet. Admins can add one above.</div>`;
    return;
  }

  gridEl.innerHTML = talks.map(t => `
    <div class="speaker-card" data-talk-id="${t.id}">
      <a class="speaker-thumb-link" href="${t.watchUrl}" target="_blank" rel="noopener">
        <div class="speaker-thumb">
          <img src="${t.thumbnailUrl}" alt="${escapeHtml(t.title)}" loading="lazy">
          <span class="speaker-play-overlay">${PLAY_ICON}</span>
        </div>
      </a>
      <div class="speaker-card-body">
        <a class="speaker-title-link" href="${t.watchUrl}" target="_blank" rel="noopener"><h3>${escapeHtml(t.title)}</h3></a>
        <div class="speaker-name">${escapeHtml(t.speakerName)}</div>
        ${t.description ? `<p>${escapeHtml(t.description)}</p>` : ""}
        ${CURRENT_USER && CURRENT_USER.isAdmin ? `
          <div class="speaker-actions">
            <button class="btn small secondary" data-delete-talk="${t.id}">Delete</button>
          </div>
        ` : ""}
      </div>
    </div>
  `).join("");

  gridEl.querySelectorAll("[data-delete-talk]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this talk?")) return;
      btn.disabled = true;
      btn.textContent = "Deleting…";
      try {
        const res = await fetch(`/api/admin/speaker-talks/${btn.getAttribute("data-delete-talk")}`, {
          method: "DELETE"
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || `Could not delete that talk (HTTP ${res.status}).`);
        }
      } catch (err) {
        alert("Could not reach the server. Please try again.");
      }
      loadTalks();
    });
  });
}

(async () => {
  const user = await bootstrapAuthAndProgress(true);
  if (!user) return;
  renderHeader(document.getElementById("site-header"), true);
  document.getElementById("brand-mark-mount").outerHTML = BRAND_MARK;
  if (user.isAdmin) renderUploadForm(document.getElementById("upload-mount"));
  loadTalks();
})();
</script>
</body>
</html>
