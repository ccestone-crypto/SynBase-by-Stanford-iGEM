<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Series — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div id="brand-mark-mount"></div>
    <span class="optional-badge">Optional</span>
    <h1>Speaker Series</h1>
    <p class="lede">Guest talks and bonus videos from the SiBRP program. Watch any time — nothing here is required to finish the curriculum.</p>
  </div>
</section>

<main class="container">
  <div id="upload-mount"></div>
  <div id="speaker-grid" class="speaker-grid"></div>
</main>

<footer class="site-footer">
  Adapted from Stanford iGEM Bioengineering Research Program (SiBRP), Session 2 — July 15th, 2026.
</footer>

<script src="js/modules-meta.js?v=6"></script>
<script src="js/progress.js?v=8"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function renderUploadForm(mountEl) {
  mountEl.innerHTML = `
    <div class="content-card">
      <h2>Upload a Talk</h2>
      <div class="auth-error" id="upload-error"></div>
      <form id="upload-form" novalidate>
        <div class="upload-form-grid">
          <div class="form-field">
            <label for="talk-title">Title</label>
            <input type="text" id="talk-title" required>
          </div>
          <div class="form-field">
            <label for="talk-speaker">Speaker</label>
            <input type="text" id="talk-speaker" required>
          </div>
          <div class="form-field full">
            <label for="talk-description">Description (optional)</label>
            <textarea id="talk-description"></textarea>
          </div>
          <div class="form-field full">
            <label for="talk-file">Video file</label>
            <input type="file" id="talk-file" accept="video/*" required>
          </div>
        </div>
        <button type="submit" class="btn" id="upload-btn" style="margin-top:16px">Upload</button>
        <div class="upload-progress" id="upload-progress">Uploading — this can take a while for large files, please don't close this tab.</div>
      </form>
    </div>
  `;

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("upload-error");
    const progressEl = document.getElementById("upload-progress");
    const btn = document.getElementById("upload-btn");
    errorEl.classList.remove("show");

    const fileInput = document.getElementById("talk-file");
    if (!fileInput.files.length) {
      errorEl.textContent = "Choose a video file to upload.";
      errorEl.classList.add("show");
      return;
    }

    const formData = new FormData();
    formData.append("title", document.getElementById("talk-title").value);
    formData.append("speakerName", document.getElementById("talk-speaker").value);
    formData.append("description", document.getElementById("talk-description").value);
    formData.append("video", fileInput.files[0]);

    btn.disabled = true;
    progressEl.classList.add("show");

    try {
      const res = await fetch("/api/admin/speaker-talks", { method: "POST", body: formData });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || `Upload failed (HTTP ${res.status}).`;
        errorEl.classList.add("show");
        return;
      }
      document.getElementById("upload-form").reset();
      loadTalks();
    } catch (err) {
      errorEl.textContent = "Could not reach the server. Please try again.";
      errorEl.classList.add("show");
    } finally {
      btn.disabled = false;
      progressEl.classList.remove("show");
    }
  });
}

async function loadTalks() {
  const res = await fetch("/api/speaker-talks");
  const data = await res.json();
  renderTalks(data.talks || []);
}

function renderTalks(talks) {
  const gridEl = document.getElementById("speaker-grid");
  if (!talks.length) {
    gridEl.innerHTML = `<div class="speaker-empty">No talks uploaded yet. Admins can add one above.</div>`;
    return;
  }

  gridEl.innerHTML = talks.map(t => `
    <div class="speaker-card" data-talk-id="${t.id}">
      <video controls preload="metadata" src="${t.url}"></video>
      <div class="speaker-card-body">
        <h3>${escapeHtml(t.title)}</h3>
        <div class="speaker-name">${escapeHtml(t.speakerName)}</div>
        ${t.description ? `<p>${escapeHtml(t.description)}</p>` : ""}
        ${CURRENT_USER && CURRENT_USER.isAdmin ? `
          <div class="speaker-actions">
            <button class="btn small secondary" data-delete-talk="${t.id}">Delete</button>
          </div>
        ` : ""}
      </div>
    </div>
  `).join("");

  gridEl.querySelectorAll("[data-delete-talk]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this talk? The video file will be removed permanently.")) return;
      btn.disabled = true;
      btn.textContent = "Deleting…";
      try {
        const res = await fetch(`/api/admin/speaker-talks/${btn.getAttribute("data-delete-talk")}`, {
          method: "DELETE"
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || `Could not delete that talk (HTTP ${res.status}).`);
        }
      } catch (err) {
        alert("Could not reach the server. Please try again.");
      }
      loadTalks();
    });
  });
}

(async () => {
  const user = await bootstrapAuthAndProgress(true);
  if (!user) return;
  renderHeader(document.getElementById("site-header"), true);
  document.getElementById("brand-mark-mount").outerHTML = BRAND_MARK;
  if (user.isAdmin) renderUploadForm(document.getElementById("upload-mount"));
  loadTalks();
})();
</script>
</body>
</html>
