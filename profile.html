<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — SynBase</title>
<link rel="icon" type="image/x-icon" href="assets/img/site/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/site/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/site/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/site/favicon-180.png">
<link rel="stylesheet" href="css/style.css?v=84">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4XQ5Y1N331"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-4XQ5Y1N331");</script>
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <h1>Your Profile</h1>
    <p class="lede">Account details and your progress through the curriculum.</p>
  </div>
</section>

<main class="container narrow">
  <div class="content-card">
    <div class="profile-header">
      <div class="profile-avatar-lg" id="profile-avatar"></div>
      <div>
        <h2 id="profile-name"></h2>
        <p class="profile-email" id="profile-email"></p>
        <div id="profile-badges"></div>
      </div>
    </div>
  </div>

  <div class="content-card">
    <h2>Profile Picture</h2>
    <p style="color:var(--ink-soft);font-size:0.9rem;margin:0 0 4px;">Pick an icon to use as your avatar.</p>
    <div class="avatar-picker-grid" id="avatar-picker-grid"></div>
    <div class="avatar-picker-status" id="avatar-picker-status"></div>
  </div>

  <div class="content-card">
    <h2>Course Progress</h2>
    <div class="profile-overall">
      <span class="profile-overall-pct" id="profile-overall-pct"></span>
      <span class="progress-track light"><span class="fill" id="profile-overall-fill" style="width:0%"></span></span>
    </div>
    <div id="profile-module-list"></div>
  </div>

  <div class="content-card">
    <button class="btn secondary" id="logout-btn">Log Out</button>
  </div>
</main>

<script src="js/modules-meta.js?v=16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=2"></script>
<script src="js/avatar-data.js?v=1"></script>
<script src="js/progress.js?v=30"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function renderAvatarLg(user) {
  const el = document.getElementById("profile-avatar");
  const src = user.avatar ? avatarUrl(user.avatar, true) : null;
  el.innerHTML = src ? `<img src="${src}" alt="">` : "";
  if (!src) el.textContent = (user.name || "?").trim().charAt(0).toUpperCase() || "?";
}

function renderAvatarPicker(user) {
  const grid = document.getElementById("avatar-picker-grid");
  const status = document.getElementById("avatar-picker-status");
  grid.innerHTML = AVATARS.map(a => `
    <button type="button" class="avatar-picker-option${user.avatar === a.id ? " selected" : ""}" data-avatar-id="${a.id}" title="${escapeHtml(a.label)}">
      <img src="${avatarUrl(a.id, true)}" alt="${escapeHtml(a.label)}">
    </button>
  `).join("");

  grid.querySelectorAll("[data-avatar-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-avatar-id");
      grid.querySelectorAll(".avatar-picker-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      status.textContent = "Saving…";
      const { error } = await supabaseClient.rpc("set_my_avatar", { p_avatar: id });
      if (error) {
        status.textContent = error.message || "Couldn't save your avatar.";
        return;
      }
      status.textContent = "Saved!";
      CURRENT_USER.avatar = id;
      renderAvatarLg(CURRENT_USER);
      renderHeader(document.getElementById("site-header"), true);
    });
  });
}

function renderProfile(user) {
  renderAvatarLg(user);
  renderAvatarPicker(user);
  document.getElementById("profile-name").textContent = user.name;
  document.getElementById("profile-email").textContent = user.email;

  const badges = [];
  if (user.isAdmin) badges.push("Admin");
  if (user.taEligible) badges.push("TA Eligible");
  document.getElementById("profile-badges").innerHTML = badges.map(b => `<span class="admin-badge">${escapeHtml(b)}</span>`).join(" ");

  const overall = overallProgress();
  document.getElementById("profile-overall-pct").textContent = `${overall.pct}%`;
  document.getElementById("profile-overall-fill").style.width = `${overall.pct}%`;

  document.getElementById("profile-module-list").innerHTML = MODULES_META.map(m => {
    const p = moduleProgress(m.id, m.sectionCount);
    return `
      <div class="profile-module-row">
        <span class="profile-module-title">${escapeHtml(m.title)}</span>
        <span class="progress-track light"><span class="fill" style="width:${p.pct}%"></span></span>
        <span class="profile-module-pct">${p.pct}%</span>
      </div>
    `;
  }).join("");
}

(async () => {
  const user = await bootstrapAuthAndProgress(true);
  if (!user) return;
  renderHeader(document.getElementById("site-header"), true);
  renderProfile(user);

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut().catch(() => {});
    location.href = loginPath(true);
  });
})();
</script>
</body>
</html>
