<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=79">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img class="brand-logo" src="assets/img/site/logo.png" alt="SynBase"><span class="brand-suffix">by Stanford iGEM</span></div>
    <p class="auth-subtitle">Create an account to track your progress through the curriculum.</p>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>

    <form id="signup-form" novalidate>
      <div class="auth-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="auth-field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="auth-field">
        <label for="education-level">I am a...</label>
        <select id="education-level" name="education-level" required>
          <option value="" disabled selected>Select one</option>
          <option value="middle_school">Middle schooler</option>
          <option value="high_school">High schooler</option>
          <option value="college">College student</option>
          <option value="beyond">Beyond college</option>
        </select>
      </div>
      <button type="submit" class="btn auth-submit" id="submit-btn">Create Account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=1"></script>
<script>
  const form = document.getElementById("signup-form");
  const errorEl = document.getElementById("auth-error");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("show");

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    if (password.length < 8) {
      showError("Password must be at least 8 characters.");
      return;
    }
    if (password !== confirm) {
      showError("Passwords don't match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    const name = document.getElementById("name").value.trim();
    if (!name) {
      showError("Please enter your name.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
      return;
    }

    const educationLevel = document.getElementById("education-level").value;
    if (!educationLevel) {
      showError("Please tell us what stage of school you're in.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
      return;
    }

    // Note: admin status is never granted here, even if you tried to pass
    // it — see supabase/migrations/0003_fix_admin_trigger_security.sql.
    // education_level carries no privilege, so it's fine to trust as-is.
    const { data, error } = await supabaseClient.auth.signUp({
      email: document.getElementById("email").value.trim().toLowerCase(),
      password,
      options: { data: { name, education_level: educationLevel } }
    });

    if (error) {
      showError(/already registered|already exists|already been registered/i.test(error.message)
        ? "An account with that email already exists."
        : error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
      return;
    }

    if (!data.session) {
      // "Confirm email" is on for this project — signUp() creates the
      // account but doesn't log them in yet.
      form.style.display = "none";
      const successEl = document.getElementById("auth-success");
      successEl.textContent = "Check your email to confirm your account, then log in.";
      successEl.classList.add("show");
      return;
    }

    location.href = "index.html";
  });
</script>
</body>
</html>
