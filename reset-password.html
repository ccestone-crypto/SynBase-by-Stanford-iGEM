<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span class="dot"></span> SynBase<span class="brand-suffix">by Stanford iGEM</span></div>
    <p class="auth-subtitle" id="auth-subtitle">Choose a new password for your account.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="reset-form" novalidate>
      <div class="auth-field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="auth-field">
        <label for="confirm">Confirm New Password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="btn auth-submit" id="submit-btn">Reset Password</button>
    </form>

    <div class="auth-switch">Back to <a href="login.html">Log in</a></div>
  </div>
</div>

<script>
  const token = new URLSearchParams(location.search).get("token");
  const form = document.getElementById("reset-form");
  const errorEl = document.getElementById("auth-error");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  if (!token) {
    document.getElementById("auth-subtitle").textContent = "This reset link is missing its token.";
    form.style.display = "none";
    showError("Request a new link from the forgot password page.");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("show");

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    if (password !== confirm) {
      showError("Passwords don't match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting…";

    try {
      const res = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || "Something went wrong. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Reset Password";
        return;
      }
      location.href = "login.html?reset=success";
    } catch (err) {
      showError("Could not reach the server. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset Password";
    }
  });
</script>
</body>
</html>
