<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=73">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img class="brand-logo" src="assets/img/site/logo.png" alt="SynBase"><span class="brand-suffix">by Stanford iGEM</span></div>
    <p class="auth-subtitle" id="auth-subtitle">Choose a new password for your account.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="reset-form" novalidate style="display:none;">
      <div class="auth-field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="auth-field">
        <label for="confirm">Confirm New Password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="btn auth-submit" id="submit-btn">Reset Password</button>
    </form>

    <div class="auth-switch">Back to <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Safe to expose client-side: the URL and anon/publishable key are public
  // by design (the anon key is rate-limited and has no table access here —
  // every app table has RLS enabled with no permissive policies, see
  // supabase/migrations/0001_initial_schema.sql). This page only ever calls
  // Supabase's own Auth API, never the database directly.
  const supabaseClient = supabase.createClient(
    "https://mbravmycmxvqfzrixthz.supabase.co",
    "sb_publishable_h8W87aAIjsZTLhu9DP_ZSA_OdyRtxfM"
  );

  const form = document.getElementById("reset-form");
  const subtitleEl = document.getElementById("auth-subtitle");
  const errorEl = document.getElementById("auth-error");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  // Supabase's reset-password email links here with the recovery session
  // encoded in the URL; supabase-js parses it automatically on load and
  // fires this event once that session is established — only then do we
  // know the link was valid and can show the actual form.
  let recoveryReady = false;
  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoveryReady = true;
      form.style.display = "";
    }
  });

  // If the link was invalid/expired, no PASSWORD_RECOVERY event ever fires —
  // give up waiting after a few seconds rather than leaving a blank page.
  setTimeout(() => {
    if (!recoveryReady) {
      subtitleEl.textContent = "This reset link is invalid or has expired.";
      showError("Request a new link from the forgot password page.");
    }
  }, 4000);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("show");

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    if (password.length < 8) {
      showError("Password must be at least 8 characters.");
      return;
    }
    if (password !== confirm) {
      showError("Passwords don't match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting…";

    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) {
      showError(error.message || "Something went wrong. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset Password";
      return;
    }

    // The recovery session Supabase just established isn't the same cookie
    // this app's own server uses, so sign it back out and send them through
    // the normal login flow with their new password.
    await supabaseClient.auth.signOut();
    location.href = "login.html?reset=success";
  });
</script>
</body>
</html>
