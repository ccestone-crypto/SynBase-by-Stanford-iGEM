<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=80">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div id="brand-mark-mount"></div>
    <h1>Apply</h1>
    <p class="lede">Finish every module to unlock the application below.</p>
  </div>
</section>

<main class="container narrow" id="app-main"></main>

<script src="js/modules-meta.js?v=16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=1"></script>
<script src="js/progress.js?v=29"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

// Mirrors server/course-config.js's isCourseComplete() — module_sections is
// the same data, seeded into Postgres by
// supabase/migrations/0002_static_frontend_rls.sql, and publicly readable.
async function isCourseComplete() {
  const { data: required } = await supabaseClient.from("module_sections").select("module_id,section_id");
  return (required || []).every(r => {
    const mod = PROGRESS_CACHE[r.module_id];
    return !!(mod && mod.sections && mod.sections[r.section_id]);
  });
}

async function getApplicationWindow(kind) {
  const { data } = await supabaseClient.from("application_windows").select("opens_at,closes_at").eq("kind", kind).maybeSingle();
  return data ? { opensAt: data.opens_at, closesAt: data.closes_at } : { opensAt: null, closesAt: null };
}

function windowStatus(window) {
  const now = Date.now();
  if (window.opensAt && now < new Date(window.opensAt).getTime()) return "not-open";
  if (window.closesAt && now > new Date(window.closesAt).getTime()) return "closed";
  return "open";
}

async function loadApplicationState() {
  const mainEl = document.getElementById("app-main");
  const [{ data: myApp }, { data: questionRows }] = await Promise.all([
    supabaseClient.from("applications").select("*").eq("user_id", CURRENT_USER.id).eq("kind", "sibrp").maybeSingle(),
    supabaseClient.from("application_questions").select("id,prompt,type").eq("kind", "sibrp").order("created_at", { ascending: true })
  ]);
  const questions = questionRows || [];

  if (myApp) {
    renderSubmitted(mainEl, myApp, questions);
    return;
  }

  const courseComplete = await isCourseComplete();
  if (!courseComplete) {
    const overall = overallProgress();
    mainEl.innerHTML = `
      <div class="locked-panel">
        <div class="locked-icon">${LOCK_ICON}</div>
        <h2>Finish the curriculum to unlock the application</h2>
        <p>You're at ${overall.pct}% overall. Complete every module before applying.</p>
        <a class="btn" href="index.html">Continue the Curriculum</a>
      </div>
    `;
    return;
  }

  const window = await getApplicationWindow("sibrp");
  const status = windowStatus(window);

  if (status === "not-open") {
    mainEl.innerHTML = `
      <div class="locked-panel">
        <div class="locked-icon">${LOCK_ICON}</div>
        <h2>Applications aren't open yet</h2>
        <p>Applications open ${escapeHtml(new Date(window.opensAt).toLocaleString())}. Check back then.</p>
      </div>
    `;
    return;
  }

  if (status === "closed") {
    mainEl.innerHTML = `
      <div class="locked-panel">
        <div class="locked-icon">${LOCK_ICON}</div>
        <h2>Applications are closed</h2>
        <p>Applications closed ${escapeHtml(new Date(window.closesAt).toLocaleString())}.</p>
      </div>
    `;
    return;
  }

  renderForm(mainEl, questions);
}

function renderSubmitted(mainEl, application, questions) {
  const submitted = new Date(application.submitted_at).toLocaleString();
  const promptById = {};
  questions.forEach(q => { promptById[q.id] = q.prompt; });

  const blocks = Object.entries(application.answers).map(([qid, answer]) => `
    <div class="answer-block">
      <div class="question">${escapeHtml(promptById[qid] || "Question (removed)")}</div>
      <div class="answer">${escapeHtml(answer)}</div>
    </div>
  `).join("");

  mainEl.innerHTML = `
    <div class="submitted-banner">Submitted ${escapeHtml(submitted)} — your application has been received.</div>
    <div class="content-card">
      <h2>Your Answers</h2>
      ${blocks}
    </div>
  `;
}

function renderForm(mainEl, questions) {
  if (!questions.length) {
    mainEl.innerHTML = `<div class="content-card"><p>There's no application open right now. Check back later.</p></div>`;
    return;
  }

  const fields = questions.map(q => `
    <div class="form-field">
      <label for="q-${q.id}">${escapeHtml(q.prompt)}</label>
      ${q.type === "long"
        ? `<textarea id="q-${q.id}" data-qid="${q.id}"></textarea>`
        : `<input type="text" id="q-${q.id}" data-qid="${q.id}">`}
    </div>
  `).join("");

  mainEl.innerHTML = `
    <div class="content-card">
      <h2>Application</h2>
      <div class="auth-error" id="app-error"></div>
      <form id="application-form" novalidate>
        ${fields}
        <button type="submit" class="btn" id="app-submit-btn">Submit Application</button>
      </form>
    </div>
  `;

  document.getElementById("application-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("app-error");
    errorEl.classList.remove("show");
    const btn = document.getElementById("app-submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting…";

    const answers = {};
    for (const q of questions) {
      const value = document.getElementById(`q-${q.id}`).value.trim();
      if (!value) {
        errorEl.textContent = `Please answer: "${q.prompt}"`;
        errorEl.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Submit Application";
        return;
      }
      answers[q.id] = value;
    }

    const { error } = await supabaseClient.from("applications").insert({
      user_id: CURRENT_USER.id,
      kind: "sibrp",
      name: CURRENT_USER.name,
      email: CURRENT_USER.email,
      answers
    });

    if (error) {
      errorEl.textContent = /duplicate key|23505/i.test(error.message)
        ? "You've already submitted an application."
        : /row-level security/i.test(error.message)
        ? "You're not eligible to apply right now."
        : (error.message || "Something went wrong. Please try again.");
      errorEl.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Submit Application";
      return;
    }
    loadApplicationState();
  });
}

(async () => {
  const user = await bootstrapAuthAndProgress(true);
  if (!user) return;
  renderHeader(document.getElementById("site-header"), true);
  document.getElementById("brand-mark-mount").outerHTML = BRAND_MARK;
  loadApplicationState();
})();
</script>
</body>
</html>
