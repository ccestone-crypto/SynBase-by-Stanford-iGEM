<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirming — SynBase</title>
<link rel="stylesheet" href="css/style.css?v=80">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img class="brand-logo" src="assets/img/site/logo.png" alt="SynBase"><span class="brand-suffix">by Stanford iGEM</span></div>
    <p class="auth-subtitle" id="auth-subtitle">Confirming your account&hellip;</p>

    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js?v=1"></script>
<script>
  // The confirmation link Supabase emailed lands here with the session
  // encoded in the URL; supabase-js parses it automatically on load
  // (detectSessionInUrl, see js/supabase-client.js) and fires this event
  // once that session is established. There's no server anymore to hand
  // tokens off to — this client-side session IS the real session now,
  // stored the same way (localStorage) it would be after a normal login.
  const subtitleEl = document.getElementById("auth-subtitle");
  const errorEl = document.getElementById("auth-error");

  function showError(msg) {
    subtitleEl.textContent = "Something went wrong.";
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  let handled = false;
  supabaseClient.auth.onAuthStateChange((event) => {
    if (handled || event !== "SIGNED_IN") return;
    handled = true;
    location.href = "index.html";
  });

  setTimeout(() => {
    if (!handled) showError("This confirmation link is invalid or has expired. Try signing up again.");
  }, 5000);
</script>
</body>
</html>
